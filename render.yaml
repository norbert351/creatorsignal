# CreatorSignal — Render blueprint.
# Deploy: "New +" > "Blueprint" > connect github.com/norbert351/creatorsignal,
# or "New Web Service" pointing at the repo root.

services:
  - type: web
    name: creatorsignal
    runtime: node
    repo: https://github.com/norbert351/creatorsignal
    rootDir: apps/backend
    # Workspace packages (shared, mind-client) resolve via ./dist and are not
    # committed, so build them first in dependency order, then the backend.
    buildCommand: pnpm install --prod=false && pnpm --filter @creatorsignal/shared build && pnpm --filter @creatorsignal/mind-client build && pnpm build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: CREATORSIGNAL_PORT
        value: '10000'
      - key: CREATORSIGNAL_AUTH
        # 'on' shows the viewer login gate (accounts). 'off' = open workspace.
        value: 'on'
      - key: CREATORSIGNAL_MIND_MODE
        value: simulated
      - key: CREATORSIGNAL_INGEST_INTERVAL_MIN
        value: '30'
      - key: CREATORSIGNAL_INGEST_DAYS_BACK
        value: '60'
      - key: CREATORSIGNAL_YOUTUBE_API_KEY
        sync: false
      - key: CREATORSIGNAL_YOUTUBE_CHANNEL_ID
        sync: false
      - key: CREATORSIGNAL_YOUTUBE_VIDEO_IDS
        sync: false
      - key: CREATORSIGNAL_TIKTOK_API_KEY
        sync: false
      - key: CREATORSIGNAL_TIKTOK_VIDEO_IDS
        sync: false
      - key: CREATORSIGNAL_X_BEARER_TOKEN
        sync: false
      - key: CREATORSIGNAL_X_USER_IDS
        sync: false
      - key: CREATORSIGNAL_X_QUERY
        sync: false
      - key: CREATORSIGNAL_LLM_API_KEY
        sync: false
      - key: CREATORSIGNAL_LLM_BASE_URL
        sync: false
      - key: CREATORSIGNAL_LLM_MODEL
        sync: false
      # Only needed if CREATORSIGNAL_MIND_MODE=telegram (real Mind relay).
      # The demo push channel is configured by each creator from the web
      # onboarding (Telegram push card) — no env required.
      - key: CREATORSIGNAL_TELEGRAM_BOT_TOKEN
        sync: false
      - key: CREATORSIGNAL_TELEGRAM_GROUP_ID
        sync: false
      - key: CREATORSIGNAL_BRIEF_DAY
        sync: false
      - key: CREATORSIGNAL_BRIEF_TIME
        sync: false
      - key: CREATORSIGNAL_API_TOKEN
        sync: false
